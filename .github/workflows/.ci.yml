name: CI pipeline for Lab Management System

on:
  push:
    branches:
      - staging

jobs:
  build-frontend:
    runs-on: [self-hosted, windows]
    if: |
      contains(join(github.event.commits.*.modified, github.event.commits.*.added, github.event.commits.*.renamed), 'packages/frontend')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install frontend dependencies
        working-directory: packages/frontend
        run: npm install

      - name: Create .env.production for frontend from secret
        run: |
          $envContent = @"
          ${{ secrets.ENV_FRONT_END }}
          "@
          Set-Content -Path "packages/frontend/.env.production" -Value $envContent
        shell: powershell

      - name: Build frontend
        working-directory: packages/frontend
        run: npm run build

      - name: Deploy frontend to IIS site "fitlab"
        run: |
          $ErrorActionPreference = "Stop"
          $siteName = "fitlab"
          $target = "C:\inetpub\wwwroot\$siteName"

          Stop-Website -Name $siteName
          Remove-Item "$target\*" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item "packages\frontend\out\*" -Destination $target -Recurse
          Start-Website -Name $siteName
        shell: powershell

  build-backend:
    runs-on: [self-hosted, windows]
    if: |
      contains(join(github.event.commits.*.modified, github.event.commits.*.added, github.event.commits.*.renamed), 'packages/backend')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file for backend from secret
        run: |
          $envContent = @"
          ${{ secrets.ENV_FILE_CONTENT }}
          "@
          Set-Content -Path "packages/backend/.env" -Value $envContent
        shell: powershell

      - name: Install backend dependencies
        working-directory: packages/backend
        run: npm install

      - name: Run Prisma migrate
        working-directory: packages/backend
        run: npm run db:migrate

      - name: Build backend
        working-directory: packages/backend
        run: npm run build

      - name: Copy .env to dist
        run: Copy-Item "packages\backend\.env" -Destination "packages\backend\dist\" -Force
        shell: powershell

      - name: Deploy backend to IIS site "fitlabapi"
        run: |
          $ErrorActionPreference = "Stop"
          $siteName = "fitlabapi"
          $target = "C:\inetpub\wwwroot\$siteName"

          Stop-Website -Name $siteName
          Remove-Item "$target\*" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item "packages\backend\dist\*" -Destination $target -Recurse
          Copy-Item "packages\backend\package.json" -Destination $target -Force
          Copy-Item "packages\backend\package-lock.json" -Destination $target -Force
          cd $target
          npm install --production
          Start-Website -Name $siteName
        shell: powershell
