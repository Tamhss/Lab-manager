name: CI pipeline for Lab Management System

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    runs-on: [self-hosted, windows]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install frontend dependencies
        working-directory: packages/frontend
        run: npm install

      - name: Install backend dependencies
        working-directory: packages/backend
        run: yarn install

      - name: Build backend
        working-directory: packages/backend
        run: yarn build

      - name: Build frontend
        working-directory: packages/frontend
        run: npm run build

      - name: Deploy frontend to IIS site "fitlab"
        run: |
          $ErrorActionPreference = "Stop"
          $siteName = "fitlab"
          $target = "C:\inetpub\wwwroot\$siteName"

          Write-Host "Stopping IIS site: $siteName"
          Stop-Website -Name $siteName -ErrorAction SilentlyContinue

          Write-Host "Clearing old files..."
          Remove-Item "$target\*" -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "Copying new frontend build files..."
          Copy-Item "packages\frontend\*" -Destination $target -Recurse

          Write-Host "Installing Node.js dependencies..."
          Set-Location $target
          npm install

          Write-Host "Checking if pm2 is installed..."
          if (-not (Get-Command pm2 -ErrorAction SilentlyContinue)) {
            Write-Host "Installing pm2 globally..."
            npm install -g pm2
          }

          Write-Host "Starting Node.js server with pm2..."
          pm2 delete "fitlab" -ErrorAction SilentlyContinue
          pm2 start npm --name "fitlab" -- start -- --port 3000

          Write-Host "Starting IIS site: $siteName"
          Start-Website -Name $siteName
        shell: powershell

      - name: Deploy backend to IIS site "fitlabapi"
        run: |
          $ErrorActionPreference = "Stop"
          $siteName = "fitlabapi"
          $target = "C:\inetpub\wwwroot\$siteName"

          Write-Host "Stopping IIS site: $siteName"
          Stop-Website -Name $siteName

          Write-Host "Clearing old files..."
          Remove-Item "$target\*" -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "Copying new backend build files..."
          Copy-Item "packages\backend\dist\*" -Destination $target -Recurse

          Write-Host "Starting IIS site: $siteName"
          Start-Website -Name $siteName
        shell: powershell